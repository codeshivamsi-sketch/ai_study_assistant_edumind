version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: edumind
      POSTGRES_PASSWORD: edumind
      POSTGRES_DB: edumind
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://edumind:edumind@postgres:5432/edumind
      REDIS_URL: redis://redis:6379/0
      NOTIFICATIONS_GRPC_URL: notifications:5001
      AGENTIC_SERVICE_URL: http://agentic:8000
      INTERNAL_CALLBACK_TOKEN: change-me-in-production
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://edumind:edumind@postgres:5432/edumind
      REDIS_URL: redis://redis:6379/0
      NOTIFICATIONS_GRPC_URL: notifications:5001
      AGENTIC_SERVICE_URL: http://agentic:8000
    command: celery -A worker worker --loglevel=info

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    ports:
      - "5000:5000"
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://edumind:edumind@postgres:5432/edumind
      REDIS_URL: redis://redis:6379/1
      HTTP_PORT: "5000"
      GRPC_PORT: "5001"

  neo4j:
    image: neo4j:latest
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  agentic:
    build: ./services/agentic
    ports:
      - "8002:8000"
    env_file:
      - ./services/agentic/.env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      AGENTIC_REDIS_URL: redis://redis:6379/2
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - agentic_chroma:/app/chroma_db
      - agentic_checkpoints:/data
      - agentic_uploads:/app/uploads

  agentic-worker:
    build: ./services/agentic
    env_file:
      - ./services/agentic/.env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      AGENTIC_REDIS_URL: redis://redis:6379/2
      CORE_API_CALLBACK_URL: http://core-api:8000
      INTERNAL_CALLBACK_TOKEN: change-me-in-production
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - agentic_chroma:/app/chroma_db
      - agentic_checkpoints:/data
      - agentic_uploads:/app/uploads
    command: rq worker --url redis://redis:6379/2 agent_jobs

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

volumes:
  neo4j_data:
  agentic_chroma:
  agentic_checkpoints:
  agentic_uploads:
