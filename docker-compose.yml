version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: creditcore
      POSTGRES_PASSWORD: creditcore
      POSTGRES_DB: creditcore
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditcore"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  origination:
    build: ./services/origination
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://creditcore:creditcore@postgres:5432/creditcore
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"

  ledger:
    build: ./services/ledger
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://creditcore:creditcore@postgres:5432/creditcore
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8001"

  worker:
    build: ./services/origination
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://creditcore:creditcore@postgres:5432/creditcore
      REDIS_URL: redis://redis:6379/0
    command: celery -A worker worker --loglevel=info

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
    