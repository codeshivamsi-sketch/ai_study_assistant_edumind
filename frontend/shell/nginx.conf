server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The manifest is edited live (bind-mounted, see docker-compose.yml) to
  # pin/roll back a remote without rebuilding — it must never be cached, or
  # an edit only takes effect on a hard refresh instead of a normal reload.
  location = /remotes.json {
    add_header Cache-Control "no-cache";
    # sendfile + a bind-mounted file replaced via atomic rename can serve a
    # stale/corrupted read on some Docker Desktop setups (macOS virtiofs) —
    # this file is small and edited live, so skip sendfile for it.
    sendfile off;
  }

  # Chunk filenames are numeric ids, not content hashes — the same URL can
  # serve different content across image rebuilds, so browsers must always
  # revalidate rather than reuse a cached copy.
  location ~* \.(js|css)$ {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri /index.html;
  }
}
