server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Chunk filenames are numeric ids, not content hashes — the same URL can
  # serve different content across image rebuilds (e.g. remoteEntry.js),
  # so browsers must always revalidate rather than reuse a cached copy.
  location ~* \.(js|css)$ {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri /index.html;
  }
}
